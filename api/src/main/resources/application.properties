server.port=${PORT:8080}
spring.application.name=solin-api

# local: H2 em arquivo; producao (Railway): SPRING_DATASOURCE_URL/USERNAME/PASSWORD do PostgreSQL
spring.datasource.url=jdbc:h2:file:./data/solin;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=${SOLIN_H2_CONSOLE:true}
spring.h2.console.path=/h2-console

spring.jackson.deserialization.fail-on-unknown-properties=false

solin.jwt.secret=${SOLIN_JWT_SECRET:solin-clyvo-vet-fiap-2026-chave-jwt-mobile-sprint3}
solin.jwt.expiration-ms=604800000

# distribuicao do APK para testadores (substitui o Firebase App Distribution)
solin.distribuicao.admin-token=${SOLIN_ADMIN_TOKEN:}
# opcional: endereco publico usado nos links de convite (sem isso, usa o host da requisicao)
solin.distribuicao.url-publica=${SOLIN_URL_PUBLICA:}
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=160MB
# atras do proxy do Railway: links de convite saem com https
server.forward-headers-strategy=framework
