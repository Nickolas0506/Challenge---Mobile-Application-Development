<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOLIN — QR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #2e7d6b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    main {
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
      max-width: 320px;
      width: 100%;
    }
    h1 { font-size: 28px; color: #2e7d6b; margin-bottom: 12px; }
    #status { font-size: 14px; line-height: 1.4; margin-bottom: 20px; min-height: 40px; color: #666; }
    #status.erro { color: #c45a3a; font-weight: 600; }
    #status.ok { color: #2e7d6b; font-weight: 600; }
    #qrcode { min-height: 260px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <main>
    <h1>SOLIN</h1>
    <p id="status">Aguardando Expo...</p>
    <div id="qrcode"></div>
  </main>
  <script type="application/json" id="boot-data">{"online":false,"url":null,"mensagem":"Feche esta aba. De duplo clique em iniciar.bat na pasta do projeto."}</script>
  <script>
    function lerBoot() {
      try {
        return JSON.parse(document.getElementById('boot-data').textContent);
      } catch {
        return { online: false, url: null, mensagem: 'Erro na pagina. Use iniciar.bat' };
      }
    }

    function mostrarQr(url) {
      const box = document.getElementById('qrcode');
      box.innerHTML = '';
      if (!url || typeof QRCode === 'undefined') return;
      new QRCode(box, {
        text: url,
        width: 240,
        height: 240,
        colorDark: '#2e7d6b',
        colorLight: '#ffffff',
      });
    }

    function mostrar(dados) {
      const st = document.getElementById('status');
      if (dados.online && dados.url) {
        st.textContent = dados.mensagem || 'Escaneie com a Camera do iPhone';
        st.className = 'ok';
        mostrarQr(dados.url);
        return;
      }
      st.textContent = dados.mensagem || 'Abra iniciar.bat e espere o Expo subir';
      st.className = 'erro';
      document.getElementById('qrcode').innerHTML = '';
    }

    async function atualizar() {
      try {
        const res = await fetch('/api/url', { cache: 'no-store' });
        mostrar(await res.json());
      } catch {
        mostrar(lerBoot());
      }
    }

    mostrar(lerBoot());
    if (location.protocol !== 'file:') {
      atualizar();
      setInterval(atualizar, 2000);
    }
  </script>
</body>
</html>
