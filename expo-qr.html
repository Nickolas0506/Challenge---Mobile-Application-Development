<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOLIN — QR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #2e7d6b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    main {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      max-width: 320px;
      width: 100%;
    }
    h1 { font-size: 28px; color: #2e7d6b; margin-bottom: 8px; }
    #status { font-size: 13px; color: #666; margin-bottom: 16px; }
    #qrcode img { display: block; margin: 0 auto; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>SOLIN</h1>
    <p id="status"><!-- STATUS --></p>
    <div id="qrcode"><!-- QR_AQUI --></div>
  </main>
</body>
</html>
