<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOLIN — QR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #2e7d6b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    main {
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
      max-width: 320px;
      width: 100%;
    }
    h1 { font-size: 28px; color: #2e7d6b; margin-bottom: 8px; }
    #status { font-size: 14px; color: #666; margin-bottom: 20px; min-height: 20px; }
    #status.erro { color: #c45a3a; font-weight: 600; }
    #status.ok { color: #2e7d6b; font-weight: 600; }
    #qrcode { display: inline-block; padding: 12px; background: #f5f7f6; border-radius: 12px; }
    #qrcode:empty::after { content: '...'; color: #999; font-size: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>SOLIN</h1>
    <p id="status">Conectando...</p>
    <div id="qrcode"></div>
  </main>
  <script>
    const BOOT = /*__EXPO_BOOT__*/;

    function limparPorta(url) {
      if (!url) return url;
      return url.replace(/\.exp\.direct:80|\.exp\.direct:443/gi, '.exp.direct');
    }

    function mostrarQr(url) {
      const u = limparPorta(url);
      document.getElementById('qrcode').innerHTML = '';
      if (!u || typeof QRCode === 'undefined') return;
      new QRCode(document.getElementById('qrcode'), {
        text: u,
        width: 240,
        height: 240,
        colorDark: '#2e7d6b',
        colorLight: '#ffffff',
      });
    }

    function mostrarStatus(dados) {
      const el = document.getElementById('status');
      if (!dados.online || !dados.url) {
        el.textContent = dados.mensagem || 'Expo offline — rode: npm run start:tunnel';
        el.className = 'erro';
        document.getElementById('qrcode').innerHTML = '';
        return;
      }
      el.textContent = 'Escaneie com a Camera do iPhone';
      el.className = 'ok';
      mostrarQr(dados.url);
    }

    async function atualizar() {
      try {
        const dados = await (await fetch('/api/url')).json();
        mostrarStatus(dados);
      } catch {
        mostrarStatus(BOOT || { online: false, mensagem: 'Rode: npm run qr' });
      }
    }

    if (location.protocol === 'file:') {
      document.getElementById('status').textContent = 'Use abrir-qr.bat (nao abra este arquivo direto)';
      document.getElementById('status').className = 'erro';
    } else {
      mostrarStatus(BOOT || { online: false });
      atualizar();
      setInterval(atualizar, 2000);
    }
  </script>
</body>
</html>
